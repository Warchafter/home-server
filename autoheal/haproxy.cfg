# =============================================================================
# autoheal-proxy — allowlist Docker API proxy for autoheal (stacks/autoheal.yaml)
# =============================================================================
# Mounted over tecnativa/docker-socket-proxy's template; its entrypoint only
# substitutes ${BIND_CONFIG}. Unlike the stock template (where POST=1 plus
# CONTAINERS=1 would also allow POST /containers/create — root on the host),
# this permits exactly the two calls autoheal 1.2.0 makes:
#   GET  /containers/json?filters={"health":["unhealthy"]}
#   POST /containers/<id>/restart?t=<timeout>
# plus /_ping and /version. Everything else gets 403.
# =============================================================================

global
    log stdout format raw daemon info
    pidfile /run/haproxy.pid
    maxconn 64

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 2m
    # a restart waits for the container's stop timeout before answering
    timeout server 2m

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind ${BIND_CONFIG}
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/(_ping|version)$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/restart$ }
    http-request deny
    default_backend dockerbackend
