# =============================================================================
# dockerproxy — read-only Docker API allowlist (stacks/dockerproxy.yaml)
# =============================================================================
# Mounted over tecnativa/docker-socket-proxy's template (its entrypoint only
# substitutes ${BIND_CONFIG}). The stock CONTAINERS=1 flag allows EVERY GET
# under /containers, including /archive and /export — Docker reads those as
# host root, so any client could copy any file out of any container (the
# Vaultwarden DB, Backrest's restic password, .env via Backrest's mounts).
#
# Allowed (GET/HEAD only) — what Homepage, Diun and the MCP server call:
#   /_ping /version /info /events /system/df
#   /containers/json                 list
#   /containers/<id>/json            inspect   (Homepage status, MCP details)
#   /containers/<id>/logs            logs      (MCP)
#   /containers/<id>/stats           stats     (Homepage)
#   /images/json, /images/<ref>/json image list/inspect (Diun; refs contain / : @)
# Everything else — archive, export, attach, changes, top, images/get, any
# write method — gets 403. Inspect still returns container Env, which is why
# this proxy also sits on an internal network only its three clients join.
# =============================================================================

global
    log stdout format raw daemon info
    pidfile /run/haproxy.pid
    maxconn 256

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    timeout server 10m

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind ${BIND_CONFIG}
    http-request deny unless METH_GET
    # no dot-segments anywhere (image refs are the only free-form part)
    http-request deny if { path,url_dec -m sub /. }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/(_ping|version|info|events|system/df)$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/(json|logs|stats)$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/images/json$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/images/[a-zA-Z0-9_./:@-]+/json$ }
    http-request deny
    default_backend dockerbackend
