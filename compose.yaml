# =============================================================================
# Home Server - Docker Compose Root
# =============================================================================
# This is the main entry point. Run everything with:
#
#   docker compose up -d          Start all services
#   docker compose down            Stop all services
#   docker compose ps              See running services
#   docker compose logs -f caddy   Follow logs for a specific service
#
# Each service is defined in its own file under stacks/ for readability.
# The 'include' directive merges them into a single Compose application,
# so all services share networks and can reference each other by name.
# =============================================================================

include:
  # --- Phase 1: Foundation ---
  - path: stacks/caddy.yaml
  - path: stacks/adguard.yaml
  - path: stacks/uptime-kuma.yaml
  - path: stacks/dockerproxy.yaml
  - path: stacks/homepage.yaml
  # --- Phase 2: Core Services ---
  - path: stacks/vaultwarden.yaml
  - path: stacks/vaultwarden-backup.yaml
  - path: stacks/jellyfin.yaml
  - path: stacks/sonarr.yaml
  - path: stacks/radarr.yaml
  - path: stacks/bazarr.yaml
  - path: stacks/prowlarr.yaml
  - path: stacks/flaresolverr.yaml
  - path: stacks/gluetun.yaml
  - path: stacks/qbittorrent.yaml
  - path: stacks/homeassistant.yaml
  - path: stacks/syncthing.yaml
  # --- Infrastructure ---
  - path: stacks/autoheal.yaml
  - path: stacks/diun.yaml
  - path: stacks/backrest.yaml
  # --- Phase 3: Advanced ---
  - path: stacks/prometheus.yaml
  - path: stacks/grafana.yaml
  - path: stacks/node-exporter.yaml
  - path: stacks/cadvisor.yaml
  - path: stacks/kavita.yaml
  - path: stacks/calibre-web.yaml
  - path: stacks/profilarr.yaml
  - path: stacks/seerr.yaml
  - path: stacks/cleanuparr.yaml
  # --- Phase 4: AI Integration ---
  - path: stacks/mcp.yaml

# =============================================================================
# Shared Networks
# =============================================================================
# The stack files declare these as `external: true`, so Compose does NOT
# create them — scripts/setup.sh does (create_networks), or by hand:
#   docker network create proxy; docker network create monitoring
#   docker network create --internal dockerapi
#   docker network create scrapers; docker network create vault
#   docker network create backups
# The driver/internal settings below document the intent; on an existing
# network they are not applied, so `dockerapi` must be created --internal.
#
# proxy:      All user-facing services join this network so Caddy can
#             reverse-proxy to them by container name. Docker's built-in DNS
#             resolves names automatically on user-defined bridge networks.
#
# dockerapi:  internal-only network for the read-only Docker API proxy and
#             its three clients. The proxy can inspect any container (Env
#             included), so nothing else may reach it.
#
# scrapers:   FlareSolverr's sandbox-less Chromium renders attacker-chosen
#             pages; only Prowlarr can talk to it.
#
# vault:      Vaultwarden on its own (Caddy doesn't route it; its port is
#             published directly).
#
# backups:    Backrest on its own — its UI is root-equivalent, published on
#             127.0.0.1 only and reached via Tailscale Serve / SSH tunnel.
#
# monitoring: Isolated network for Prometheus, Node Exporter, cAdvisor, and
#             Grafana. Keeps host metrics (CPU, RAM, disk, processes) away
#             from application containers. Grafana is on BOTH networks —
#             proxy (so Caddy can reach it) and monitoring (so it can query
#             Prometheus).
# =============================================================================
networks:
  proxy:
    name: proxy
    driver: bridge
  monitoring:
    name: monitoring
    driver: bridge
  dockerapi:
    name: dockerapi
    driver: bridge
    internal: true   # no egress; only dockerproxy + its clients (homepage, diun, mcp)
  scrapers:
    name: scrapers
    driver: bridge   # FlareSolverr + Prowlarr only; keeps the browser off `proxy`
  vault:
    name: vault
    driver: bridge   # Vaultwarden alone: egress for icons/push, no app neighbours
  backups:
    name: backups
    driver: bridge   # Backrest alone: egress to B2; its UI is loopback-only
