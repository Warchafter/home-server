# =============================================================================
# Prometheus - Metrics Collection
# =============================================================================
# Prometheus scrapes metrics from Node Exporter (host metrics) and cAdvisor
# (container metrics), storing them in a time-series database. Grafana queries
# Prometheus to render dashboards.
#
# Not directly user-facing — access metrics through Grafana at :8100.
#
# DATA RETENTION: 30 days or 10 GB, whichever comes first — set in
# prometheus/prometheus.yml (storage.tsdb.retention; the CLI flag is
# deprecated in 3.x). The size cap keeps metrics from helping fill the disk.
#
# UPGRADED 2.53 -> 3.x: the TSDB is now only readable by 2.55+. Roll back to
# v2.55.1, not v2.53.5, or restore prometheus_data from backup.
#
# SCRAPE CONFIG: See prometheus/prometheus.yml for targets and intervals.
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "0.50"
          memory: 1g

volumes:
  prometheus_data:
    name: prometheus_data

networks:
  monitoring:
    external: true
