# =============================================================================
# Uptime Kuma - Service Monitoring
# =============================================================================
# Monitors your services and alerts you when something goes down.
# Supports HTTP, TCP, DNS, and ping checks with a beautiful dashboard.
#
# NOTE: This service does NOT publish ports directly to the host.
# It is only reachable through Caddy on the shared 'proxy' network.
# This is a key security pattern — the reverse proxy is the single
# point of entry. If you need direct access for debugging, uncomment
# the ports section below.
#
# Access at: http://SERVER_IP:8090 (routed through Caddy)
#
# 2.x: no PUID/setpriv entrypoint any more, so no SETUID/SETGID. The first
# start after 1.23 runs a one-way data migration — stop autoheal and do not
# interrupt it (docs/upgrade-2026-11.md).
# =============================================================================

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Monitoring data is stored in SQLite inside this volume
      - uptime_kuma_data:/app/data
    networks:
      - proxy
      - monitoring
    # Uncomment for direct access (bypassing Caddy):
    # ports:
    #   - "3001:3001"
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      # The image's own Go probe (GET /). /api/entry was never a real route —
      # it only passed via the SPA catch-all — and 2.x's temporary migration
      # server 404s it, which would get autoheal to kill the v1->v2 migration.
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 5
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "0.50"
          memory: 512m

volumes:
  uptime_kuma_data:
    name: uptime_kuma_data

networks:
  proxy:
    external: true
  monitoring:
    external: true
