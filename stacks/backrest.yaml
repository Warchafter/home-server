# =============================================================================
# Backrest - Encrypted Backups (restic + web UI)
# =============================================================================
# Everything that is NOT re-downloadable lives on one NVMe today: every app's
# config/database (Docker volumes), Vaultwarden and its daily dumps, the .env,
# Syncthing data, and the book/comic library. Backrest runs restic on a
# schedule and ships encrypted snapshots offsite (Backblaze B2).
#
# PRIVACY: restic encrypts client-side (AES-256) before upload — B2 only ever
# stores ciphertext. Lose the repository password and the backups are
# unrecoverable: keep it in Vaultwarden AND on paper, since Vaultwarden's
# server is one of the things being backed up.
#
# READ-ONLY SOURCES: everything is mounted :ro under /userdata. Backrest runs
# as root (the image has no PUID) with every capability dropped except
# DAC_READ_SEARCH, which lets it read files owned by any container UID but
# not write them. Restore to /restore (a writable scratch volume) and copy
# back by hand; in-place restores would need more caps on purpose.
#
# CONSISTENCY: live SQLite files are copied as-is. The apps' own backups are
# included and are the consistent copies to restore first: Vaultwarden's daily
# dump (vaultwarden_backup volume), Sonarr/Radarr/Prowlarr's weekly zips
# (config/Backups), Home Assistant's backups. Schedule the plan for ~03:00.
#
# FIRST RUN: the UI is open until the first-run setup sets a username and
# password — do it immediately after `docker compose up -d backrest`.
# Setup walkthrough: docs/backups.md
#
# Access at: http://SERVER_IP:8106 (routed through Caddy)
# =============================================================================

services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1
    container_name: backrest
    hostname: backrest         # restic records it per snapshot; keep it fixed
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH        # read (never write) files of any owner
    read_only: true
    tmpfs:
      - /tmp:size=512m
    environment:
      - TZ=${TZ:-UTC}
      # Backblaze B2 via its S3 API (restic's recommended B2 backend).
      # Application key scoped to the one backup bucket.
      - AWS_ACCESS_KEY_ID=${BACKREST_B2_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${BACKREST_B2_APP_KEY:-}
    volumes:
      # Backrest state (config.json holds the repo password, chmod 0600)
      - backrest_data:/data
      - backrest_config:/config
      - backrest_cache:/cache
      - backrest_restore:/restore
      # --- backup sources, all read-only ---
      - /var/lib/docker/volumes:/userdata/docker-volumes:ro
      - ..:/userdata/home-server:ro                 # repo + .env + TLS cert
      - ${SYNCTHING_DATA_PATH:-/srv/syncthing}:/userdata/syncthing:ro
      - ${MEDIA_PATH:-/srv/media}/books:/userdata/books:ro
      - ${MEDIA_PATH:-/srv/media}/comics:/userdata/comics:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9898/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g

volumes:
  backrest_data:
    name: backrest_data
  backrest_config:
    name: backrest_config
  backrest_cache:
    name: backrest_cache
  backrest_restore:
    name: backrest_restore

networks:
  proxy:
    external: true
