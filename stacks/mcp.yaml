# =============================================================================
# Home Server MCP - Read-Only AI Tool Server
# =============================================================================
# A Model Context Protocol (MCP) server exposing the server's operational
# state to AI clients: Claude Code on the dev laptop and Odysseus (local LLM
# workspace). Streamable HTTP transport, routed through Caddy at :8105.
#
# Tools (all read-only):
#   containers  list_services, service_details, service_logs, service_logs_grep,
#               restart_events, docker_disk_usage        (via dockerproxy, POST blocked)
#   metrics     prometheus_query, prometheus_query_range  (Prometheus)
#   media       media_usage, download_orphans            (/media mounted :ro)
#   apps        arr_status, qbittorrent_status, jellyfin_status
#               (the apps' own APIs, GET only, keys from .env)
#   dns         dns_check  (host resolver dir mounted :ro; this container has
#               NO dns: pin on purpose so it inherits host DNS like an
#               unpinned container would — it is the canary)
#   digest      health_summary (all of the above in one call)
#
# Client setup (from a LAN/Tailscale machine):
#   claude mcp add --transport http homeserver http://SERVER_IP:8105/mcp \
#     --header "Authorization: Bearer $MCP_AUTH_TOKEN"
#   Odysseus: Settings > MCP > add HTTP server with the same URL + header
#
# SECURITY: MCP_AUTH_TOKEN in .env is required (openssl rand -hex 32); every
# request except GET /health needs `Authorization: Bearer <token>`, and the
# server refuses to start without one. Container names passed to the Docker
# tools are validated (core.container_ref) so they can't reach other API
# endpoints; dockerproxy's allowlist is the second layer.
# Logs and app APIs reachable through these tools include torrent names,
# library paths and container env-derived detail, so keep the token on.
# Keep this service read-only — bearer auth is not a reason to add
# restart/exec/write tools.
# =============================================================================

services:
  mcp:
    build: ../mcp
    container_name: mcp
    restart: unless-stopped
    labels:
      - "diun.enable=false"   # locally built; no registry to watch
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - DOCKER_PROXY_URL=http://dockerproxy:2375
      - PROMETHEUS_URL=http://prometheus:9090
      # Bearer token for /mcp — required (the server exits without one)
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env (openssl rand -hex 32)}
      # App APIs — same keys Homepage uses. Leave blank to disable that tool.
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - BAZARR_API_KEY=${BAZARR_API_KEY:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - QBITTORRENT_USER=${QBITTORRENT_USER:-admin}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS:-}
    volumes:
      # Media root, read-only: disk forensics (media_usage, download_orphans)
      # and Jellyfin stale-item checks. Same mount path as the media stacks.
      - ${MEDIA_PATH:-/srv/media}:/media:ro
      # Host resolver state, read-only: dns_check flags Tailscale MagicDNS
      # taking over the host's resolv.conf.
      - /run/systemd/resolve:/host/resolve:ro
    networks:
      - proxy        # reach the apps, and be reachable by Caddy
      - monitoring   # reach Prometheus (internal-only network)
      - dockerapi    # read-only Docker API
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "0.50"
          memory: 256m

networks:
  proxy:
    external: true
  dockerapi:
    external: true
  monitoring:
    external: true
