# =============================================================================
# Docker Socket Proxy - Secure Docker API Access
# =============================================================================
# The Docker socket (/var/run/docker.sock) grants root-equivalent access to
# the host. Instead of mounting it directly into Homepage, we proxy it through
# this container which only exposes safe, read-only API endpoints.
#
# Clients: Homepage (status/stats), Diun (image metadata) and the MCP server
# (inspect/logs/events/df). They reach it on the internal `dockerapi` network,
# which nothing else joins and which has no route out.
#
# ACCESS: allowlist in dockerproxy/haproxy.cfg — GET only, list/inspect/logs/
# stats/events/images/df. The stock CONTAINERS=1 flag also allowed GET
# /containers/<id>/archive and /export (copy any file out of any container),
# so the env-flag ACL is no longer used. Rejected calls log a 403:
#   docker logs dockerproxy 2>&1 | grep ' 403 '
#
# See: https://github.com/Tecnativa/docker-socket-proxy
# =============================================================================

services:
  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: dockerproxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      # TCP :2375 (the stock default). The allowlist lives in
      # dockerproxy/haproxy.cfg; the tecnativa env flags are ignored with a
      # custom template, so none are set here.
      - BIND_CONFIG=:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../dockerproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      - dockerapi    # internal-only; joined by homepage, diun and mcp, nothing else
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/version || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "0.25"
          memory: 64m

networks:
  dockerapi:
    external: true
