# /etc/ssh/sshd_config.d/00-hardening.conf — key-only SSH for the home server
#
# sshd keeps the FIRST value it reads for each option, and Ubuntu includes
# sshd_config.d/*.conf in lexical order before the main file. The 00- prefix
# makes this win over 50-cloud-init.conf (which sets PasswordAuthentication yes).
#
# Install only after your key works (see docs/security-hardening.md):
#   sudo install -m 0644 host/ssh/00-hardening.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t && sudo systemctl reload ssh

PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
GSSAPIAuthentication no
AllowUsers wachacha
